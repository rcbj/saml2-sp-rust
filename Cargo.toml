[package]
name = "saml2-sp"
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["rcbjBlueMars <9321971+rcbjBlueMars@users.noreply.github.com>"]
description = "SAML 2.0 service provider"
repository = "https://github.com/rcbj/saml2-sp-rust"
homepage = "https://github.com/rcbj/saml2-sp-rust"
documentation = "https://docs.rs/saml2-sp"
readme = "README.md"
keywords = ["saml", "saml2", "sso", "caep"]
categories = ["authentication"]

[dependencies]
aes = "0.9"
aes-gcm = "0.11"
base64 = "0.22"
cbc = "0.2"
cipher = "0.5"
ed25519-dalek = "2"
flate2 = "1"
hmac = "0.12"
libc = "0.2"
native-tls = "0.2"
p256 = { version = "0.14", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
rcgen = "0.14"
rsa = { version = "0.9", features = ["sha2", "pem"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
time = "0.3"
ua-cryptography-xml-c14n = "0.1"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
x509-parser = "0.18"

[dev-dependencies]
regex = "1"

[[bin]]
name = "saml2-sp"
path = "src/bin/saml2-sp.rs"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"
